name: CI — Next.js

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, security e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify toolchain and locked versions
        run: npm run check:versions

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_PASSWORD: ci-only-app-password
        run: docker compose --env-file .env.example config --quiet
        working-directory: .

      - name: Build Docker development image
        run: docker build -f web/Dockerfile.dev -t resgate-web-dev:ci web
        working-directory: .
