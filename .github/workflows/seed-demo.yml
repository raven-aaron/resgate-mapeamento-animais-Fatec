name: CI — Seed DEMO e Insomnia

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-demo:
    name: Seed em MySQL isolado + consulta pública + coleção
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Testar contrato do seed e coleção Insomnia sem Docker
        run: node --test backend/database/tests/seed-demo.test.mjs
      - name: Preparar ambiente DEMO independente
        run: |
          cp .env.demo.example .env.demo
          sed -i 's/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci_root_demo_local_2026/' .env.demo
          sed -i 's/^MYSQL_PASSWORD=$/MYSQL_PASSWORD=ci_app_demo_local_2026/' .env.demo
          docker compose --env-file .env.demo -p resgate-animais-demo config --quiet
      - name: Iniciar banco DEMO (volumes isolados)
        run: docker compose --env-file .env.demo -p resgate-animais-demo up -d --wait --wait-timeout 180 mysql
      - name: Aplicar migrações somente no banco DEMO
        env:
          RESGATE_DEMO: "1"
        run: |
          node backend/database/scripts/migrar.mjs
          node backend/database/scripts/migrar.mjs --status
      - name: Aplicar seed sintético e bloquear duplicação
        env:
          RESGATE_DEMO: "1"
          DEMO_SEED_PASSWORD: "SenhaSomenteRunnerCI2026!"
        run: |
          node backend/database/scripts/seed-demo.mjs --apply --count 40 --users 12 --chats 18 --seed 2026
          if node backend/database/scripts/seed-demo.mjs --apply --count 40 --users 12 --chats 18 --seed 2026; then
            echo 'ERRO: seed aceitou banco não vazio'
            exit 1
          else
            echo 'OK: reexecução protegida'
          fi
      - name: Iniciar aplicação DEMO na porta 3001
        run: docker compose --env-file .env.demo -p resgate-animais-demo up -d --build web
      - name: Enriquecer fotos e posições sem afetar outras contas
        run: |
          docker compose --env-file .env.demo -p resgate-animais-demo exec -T -e RESGATE_DEMO=1 -e CI=true -e DEMO_MEDIA_OFFLINE=1 web node scripts/enriquecer-demo.mjs --dry-run
          docker compose --env-file .env.demo -p resgate-animais-demo exec -T -e RESGATE_DEMO=1 -e CI=true -e DEMO_MEDIA_OFFLINE=1 web node scripts/enriquecer-demo.mjs --apply
          docker compose --env-file .env.demo -p resgate-animais-demo exec -T -e RESGATE_DEMO=1 -e CI=true -e DEMO_MEDIA_OFFLINE=1 web node scripts/enriquecer-demo.mjs --apply
      - name: Confirmar dados reais via API pública
        run: |
          node --input-type=module -e '
            let resposta;
            for (let i=0;i<100;i++){
              try { resposta=await fetch("http://127.0.0.1:3001/api/ocorrencias",{signal:AbortSignal.timeout(3000)}); if(resposta.ok)break; }catch{}
              await new Promise(r=>setTimeout(r,1500));
            }
            if(!resposta?.ok)throw new Error("API DEMO não respondeu");
            const json=await resposta.json();
            if(!Array.isArray(json.ocorrencias)||json.ocorrencias.length<15)
              throw new Error("Ocorrências sintéticas não apareceram no mapa: "+JSON.stringify(json).slice(0,500));
            if(!json.ocorrencias.every(o=>o.status_aprovacao==="APROVADO"&&o.status_caso==="ABERTO"))
              throw new Error("A API revelou registros pendentes ou encerrados");
            const distintos=new Set(json.ocorrencias.map(o=>o.latitude+","+o.longitude));
            if(distintos.size<18)throw new Error("Pins concentrados: só "+distintos.size+" coordenadas distintas");
            if(!json.ocorrencias.every(o=>/^\/api\/fotos\/[0-9a-f-]+\.jpg$/.test(o.foto||"")))
              throw new Error("Há ocorrências sem fotos locais no mapa");
            const urlFoto="http://127.0.0.1:3001"+json.ocorrencias[0].foto;
            const imagem=await fetch(urlFoto,{signal:AbortSignal.timeout(10000)});
            if(imagem.status!==200||!imagem.headers.get("content-type")?.includes("image/jpeg"))
              throw new Error("Foto não foi servida pelo backend: HTTP "+imagem.status);
            const conteudo=new Uint8Array(await imagem.arrayBuffer());
            if(conteudo[0]!==255||conteudo[1]!==216)throw new Error("Foto JPG inválida");
            console.log("OK: "+json.ocorrencias.length+" ocorrências, "+distintos.size+" pins e foto pública HTTP 200.");
          '
      - name: Diagnóstico em caso de falha
        if: failure()
        run: docker compose --env-file .env.demo -p resgate-animais-demo logs --tail=120 mysql web
      - name: Descartar SOMENTE os volumes DEMO do runner
        if: always()
        run: |
          if test -f .env.demo; then
            docker compose --env-file .env.demo -p resgate-animais-demo down --volumes --remove-orphans
          fi
